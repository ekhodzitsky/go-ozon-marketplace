apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alerts.yml

    scrape_configs:
      - job_name: 'kubernetes-services'
        kubernetes_sd_configs:
          - role: service
            namespaces:
              names:
                - default
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_service_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_service_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_service_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: kubernetes_name

      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - default
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - action: labelmap
            regex: __meta_kubernetes_pod_label_(.+)
          - source_labels: [__meta_kubernetes_namespace]
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: kubernetes_pod_name
  alerts.yml: |
    groups:
      - name: marketplace
        rules:
          - alert: HighErrorRate
            expr: rate(grpc_server_handled_total{status!="OK"}[5m]) / rate(grpc_server_handled_total[5m]) > 0.01
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High error rate in {{ $labels.service }}"

          - alert: HighLatency
            expr: histogram_quantile(0.99, rate(grpc_server_handling_seconds_bucket[5m])) > 0.5
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High latency in {{ $labels.service }}"

          - alert: LowAvailability
            expr: avg_over_time(up[1h]) < 0.999
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Low availability"

          - alert: DBConnectionsHigh
            expr: db_connections_active / db_connections_max > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "DB connections high in {{ $labels.service }}"

          - alert: RedisMemoryHigh
            expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Redis memory high"

          - alert: KafkaConsumerLag
            expr: kafka_consumer_group_lag > 1000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Kafka consumer lag high for {{ $labels.topic }}"
