  infrastructure.json: |
    {
      "id": null,
      "uid": "infrastructure",
      "title": "Infrastructure",
      "tags": ["infra", "k8s", "db"],
      "timezone": "browser",
      "schemaVersion": 36,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "title": "CPU Usage by Pod",
          "type": "timeseries",
