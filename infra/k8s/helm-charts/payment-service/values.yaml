replicaCount: 2

image:
  repository: go-ozon-marketplace/payment-service
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: ClusterIP
  grpcPort: 50054
  metricsPort: 51054

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
  hosts:
    - host: payment-service.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

env:
  GRPC_PORT: "50054"

secrets:
  jwtSecret: ""      # required
  postgresDSN: ""    # required

nodeSelector: {}
tolerations: []
affinity: {}
