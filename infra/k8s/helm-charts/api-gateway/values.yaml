replicaCount: 2

image:
  repository: go-ozon-marketplace/api-gateway
  pullPolicy: IfNotPresent
  tag: ""

service:
  type: ClusterIP
  httpPort: 8080
  grpcPort: 8080
  metricsPort: 9080

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  hosts:
    - host: api-gateway.local
      paths:
        - path: /graphql
          pathType: Prefix
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 500m
    memory: 512Mi

env:
  PORT: "8080"
  USER_SERVICE_ADDR: "user-service:50051"
  CATALOG_SERVICE_ADDR: "catalog-service:50052"
  ORDER_SERVICE_ADDR: "order-service:50055"
  INVENTORY_SERVICE_ADDR: "inventory-service:50053"
  PAYMENT_SERVICE_ADDR: "payment-service:50054"
  ANALYTICS_SERVICE_ADDR: "analytics-service:50057"
  REDIS_ADDR: "redis:6379"

secrets:
  jwtSecret: ""      # обязательно

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}
tolerations: []
affinity: {}
