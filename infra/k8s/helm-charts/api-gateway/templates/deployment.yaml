apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api-gateway.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "api-gateway.name" . }}
    helm.sh/chart: {{ include "api-gateway.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "api-gateway.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "api-gateway.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.env.PORT | quote }}
            - name: USER_SERVICE_ADDR
              value: {{ .Values.env.USER_SERVICE_ADDR | quote }}
            - name: CATALOG_SERVICE_ADDR
              value: {{ .Values.env.CATALOG_SERVICE_ADDR | quote }}
            - name: ORDER_SERVICE_ADDR
              value: {{ .Values.env.ORDER_SERVICE_ADDR | quote }}
            - name: INVENTORY_SERVICE_ADDR
              value: {{ .Values.env.INVENTORY_SERVICE_ADDR | quote }}
            - name: PAYMENT_SERVICE_ADDR
              value: {{ .Values.env.PAYMENT_SERVICE_ADDR | quote }}
            - name: ANALYTICS_SERVICE_ADDR
              value: {{ .Values.env.ANALYTICS_SERVICE_ADDR | quote }}
            - name: REDIS_ADDR
              value: {{ .Values.env.REDIS_ADDR | quote }}
            - name: RUST_LOG
              value: {{ .Values.env.RUST_LOG | quote }}
            - name: RATE_LIMIT_REQUESTS
              value: {{ .Values.env.RATE_LIMIT_REQUESTS | quote }}
            - name: RATE_LIMIT_WINDOW_SECONDS
              value: {{ .Values.env.RATE_LIMIT_WINDOW_SECONDS | quote }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ .Values.env.CORS_ALLOWED_ORIGINS | quote }}
            - name: ENABLE_INTROSPECTION
              value: {{ .Values.env.ENABLE_INTROSPECTION | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.env.OTEL_EXPORTER_OTLP_ENDPOINT | default "http://jaeger.monitoring.svc.cluster.local:4318" | quote }}
          envFrom:
            - secretRef:
                name: {{ include "api-gateway.fullname" . }}-secrets
          livenessProbe:
            httpGet:
              path: /admin/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /admin/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
