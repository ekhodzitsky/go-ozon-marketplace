# Allow marketplace services to reach data stores, messaging, monitoring and each other.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: services-egress
  namespace: marketplace-staging
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - api-gateway
          - user-service
          - catalog-service
          - inventory-service
          - payment-service
          - order-service
          - notification-service
          - analytics-service
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: marketplace-staging
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: postgres
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redis
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: elasticsearch
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: clickhouse
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
