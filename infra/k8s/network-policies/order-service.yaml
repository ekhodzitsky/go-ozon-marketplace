apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-service
  namespace: default
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: order-service
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: api-gateway
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: inventory-service
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: payment-service
