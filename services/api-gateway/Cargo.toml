[package]
name = "api-gateway"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-graphql = "=7.0.0"
async-graphql-axum = "=7.0.0"
async-graphql-value = "=7.0.0"
async-graphql-parser = "=7.0.0"
async-graphql-derive = "=7.0.0"
tonic = { version = "0.13", features = ["tls-ring", "transport"] }
prost = "0.13"
prost-types = "0.13"
jsonwebtoken = "9"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
redis = { version = "1.2.4", features = ["tokio-comp"] }
deadpool-redis = "0.23.0"
futures = "0.3.32"
regex = "1.12.4"
once_cell = "1.21.4"
tokio-stream = "0.1.18"

[build-dependencies]
tonic-build = "0.13"
