name: graphify

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - '.graphifyignore'
      - 'scripts/graphify.sh'
      - 'scripts/graphify_test.sh'
      - '.github/workflows/graphify.yml'
  push:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Check helper script syntax
        run: bash -n scripts/graphify.sh

      - name: Run helper script smoke test
        run: ./scripts/graphify_test.sh

      - name: Validate .graphifyignore syntax
        run: |
          git -c core.excludesfile=.graphifyignore check-ignore -v \
            graphify-out/graph.json \
            api/gen/go/example.go \
            bin/foo \
            foo_test.go \
            scripts/scripts

  generate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Graphify
        run: |
          python3 -m pip install --upgrade pip
          # PyPI package name is graphifyy (two y's) — see https://pypi.org/project/graphifyy/
          python3 -m pip install "graphifyy>=0.8.0,<0.9.0"

      - name: Generate knowledge graph (offline)
        run: graphify extract .

      - name: Upload graph artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: graphify-out
          path: graphify-out/
          retention-days: 7
