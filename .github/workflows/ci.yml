name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59.1
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Sync workspace
        run: go work sync

      - name: Run tests with coverage
        run: |
          set -euo pipefail
          go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | grep total | awk '{print "COVERAGE=" $3}' >> $GITHUB_ENV

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Enforce minimum coverage
        run: |
          set -euo pipefail
          COVERAGE="${{ env.COVERAGE }}"
          if [ -z "$COVERAGE" ]; then
            echo "Coverage not found"
            exit 1
          fi
          python3 -c "
          import sys
          cov = float('$COVERAGE'.rstrip('%'))
          if cov < 60:
              print(f'Coverage {cov}% is below threshold 60%')
              sys.exit(1)
          print(f'Coverage {cov}% meets threshold')
          "

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 15
    strategy:
      matrix:
        service:
          - api-gateway
          - catalog-service
          - inventory-service
          - order-service
          - payment-service
          - user-service
          - analytics-service
          - notification-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          set -euo pipefail
          docker build --build-arg SERVICE_NAME=${{ matrix.service }} -f Dockerfile -t ${{ matrix.service }}:ci .

  helm:
    name: Lint Helm Charts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: 3.14.0

      - name: Lint Helm charts
        run: |
          set -euo pipefail
          charts=(infra/k8s/helm-charts/*)
          if [ ! -d "${charts[0]}" ]; then
            echo "No Helm charts found"
            exit 1
          fi
          for chart in "${charts[@]}"; do
            helm lint "$chart"
            helm template test "$chart" > /dev/null
          done
