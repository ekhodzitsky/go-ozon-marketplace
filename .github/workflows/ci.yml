name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Run golangci-lint per module
        run: make lint

  proto:
    name: Proto Lint & Breaking
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          cache: true

      - name: Install buf
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1
        with:
          version: 1.70.0
          github_token: ${{ secrets.GITHUB_TOKEN }}
          setup_only: true

      - name: buf lint
        run: cd api && buf lint

      - name: buf breaking (against master)
        if: github.ref != 'refs/heads/master'
        run: cd api && buf breaking --against '.git#branch=master'

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck per module
        run: |
          set -euo pipefail
          for m in ./api ./pkg ./scripts $(find ./services -mindepth 1 -maxdepth 1 ! -name api-gateway) ./tests; do
            echo "=== govulncheck $m ==="
            (cd "$m" && govulncheck ./...) || exit 1
          done

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [proto]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Sync workspace
        run: go work sync

      - name: Install gocovmerge
        run: go install github.com/wadey/gocovmerge@latest

      - name: Run Rust tests
        run: |
          set -euo pipefail
          cd services/api-gateway
          cargo test

      - name: Run Go tests with coverage
        run: |
          set -euo pipefail
          coverage_files=()
          for m in ./api ./pkg ./scripts $(find ./services -mindepth 1 -maxdepth 1 ! -name api-gateway) ./tests; do
            echo "=== Testing $m ==="
            covfile="coverage_$(echo "$m" | tr '/' '_').out"
            (cd "$m" && go test -race -count=1 -coverprofile="$covfile" -covermode=atomic ./...) || exit 1
            if [ -f "$m/$covfile" ]; then
              coverage_files+=("$m/$covfile")
            fi
          done
          if [ ${#coverage_files[@]} -gt 0 ]; then
            gocovmerge "${coverage_files[@]}" > coverage.out
          fi

      - name: Upload coverage
        uses: codecov/codecov-action@fa9a6909dc02281d24b410b6ee3dd8c5675a2e76 # v4.3.0
        with:
          files: ./coverage.out
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Enforce minimum coverage
        run: |
          set -euo pipefail
          if [ ! -f coverage.out ]; then
            echo "coverage.out not found"
            exit 1
          fi
          total=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | sed 's/%//')
          echo "COVERAGE=${total}%" >> "$GITHUB_ENV"
          threshold=15
          if (( $(echo "$total < $threshold" | bc -l) )); then
            echo "Coverage ${total}% is below threshold ${threshold}%"
            exit 1
          fi
          echo "Coverage ${total}% meets threshold"

  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 15
    strategy:
      matrix:
        service:
          - api-gateway
          - catalog-service
          - inventory-service
          - order-service
          - payment-service
          - user-service
          - analytics-service
          - notification-service
    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Build Docker image
        run: |
          set -euo pipefail
          if [ "${{ matrix.service }}" = "api-gateway" ]; then
            docker build -f services/api-gateway/Dockerfile -t api-gateway:ci .
          else
            docker build --build-arg SERVICE_NAME=${{ matrix.service }} -f Dockerfile -t ${{ matrix.service }}:ci .
          fi

  helm:
    name: Lint Helm Charts
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1

      - name: Set up Helm
        uses: azure/setup-helm@fe7b79cd5ee1e45176fcad797de68ecaf3ca4814 # v4.2.0
        with:
          version: 3.14.0

      - name: Lint Helm charts
        run: |
          set -euo pipefail
          charts=(infra/k8s/helm-charts/*)
          if [ ! -d "${charts[0]}" ]; then
            echo "No Helm charts found"
            exit 1
          fi
          for chart in "${charts[@]}"; do
            helm lint "$chart"
            helm template test "$chart" \
              --set image.tag=ci \
              --set secrets.jwtSecret=dummy \
              --set secrets.postgresDSN=dummy > /dev/null
          done