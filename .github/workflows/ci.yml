name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=5m

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Sync workspace
        run: go work sync

      - name: Run tests with coverage
        run: |
          go test -race -count=1 -coverprofile=coverage.out -covermode=atomic ./...
          go tool cover -func=coverage.out | grep total | awk '{print "COVERAGE=" $3}' >> $GITHUB_ENV

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          fail_ci_if_error: false

      - name: Enforce minimum coverage
        run: |
          echo "Coverage: ${{ env.COVERAGE }}"
          # Threshold: 30% (will increase as more tests are added)
          python3 -c "
          import sys
          cov = float('${{ env.COVERAGE }}'.rstrip('%'))
          if cov < 30:
              print(f'Coverage {cov}% is below threshold 30%')
              sys.exit(1)
          print(f'Coverage {cov}% meets threshold')
          "
