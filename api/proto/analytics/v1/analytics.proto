syntax = "proto3";

package analytics.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/ekhodzitsky/go-ozon-marketplace/api/gen/go/analytics/v1;analyticsv1";

service AnalyticsService {
  rpc TrackEvent(TrackEventRequest) returns (TrackEventResponse);
  rpc GetDailyRevenue(GetDailyRevenueRequest) returns (GetDailyRevenueResponse);
  rpc TrackABTestEvent(TrackABTestEventRequest) returns (TrackABTestEventResponse);
}

message TrackEventRequest {
  string event_type = 1 [(buf.validate.field).string.min_len = 1];
  string aggregate_id = 2 [(buf.validate.field).string.min_len = 1];
  string payload = 3;
  string aggregation_key = 4 [(buf.validate.field).string.min_len = 1];
}

message TrackEventResponse {
  bool success = 1;
}

message GetDailyRevenueRequest {
  string date = 1 [(buf.validate.field).string.min_len = 1];
}

message GetDailyRevenueResponse {
  double revenue = 1;
}

message TrackABTestEventRequest {
  string experiment = 1 [(buf.validate.field).string.min_len = 1];
  string variation = 2 [(buf.validate.field).string.min_len = 1];
  string user_id = 3 [(buf.validate.field).string.min_len = 1];
  bool conversion = 4;
  int64 revenue_minor = 5 [(buf.validate.field).int64.gte = 0];
}

message TrackABTestEventResponse {
  bool success = 1;
}
