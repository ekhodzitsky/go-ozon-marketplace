syntax = "proto3";

package inventory.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/ekhodzitsky/go-ozon-marketplace/api/gen/go/inventory/v1;inventoryv1";

enum LedgerOperation {
  LEDGER_OPERATION_UNSPECIFIED = 0;
  LEDGER_OPERATION_RESERVE = 1;
  LEDGER_OPERATION_RELEASE = 2;
  LEDGER_OPERATION_REFUND = 3;
  LEDGER_OPERATION_ADJUST = 4;
}

service InventoryService {
  rpc Reserve(ReserveRequest) returns (ReserveResponse);
  rpc Release(ReleaseRequest) returns (ReleaseResponse);
  rpc GetStock(GetStockRequest) returns (GetStockResponse);
  rpc GetLedger(GetLedgerRequest) returns (GetLedgerResponse);
}

message ReserveRequest {
  string product_id = 1 [(buf.validate.field).string.min_len = 1];
  int32 quantity = 2 [(buf.validate.field).int32.gt = 0];
  string order_id = 3 [(buf.validate.field).string.min_len = 1];
  string idempotency_key = 4 [(buf.validate.field).string.min_len = 1];
}

message ReserveResponse {
  bool success = 1;
}

message ReleaseRequest {
  string product_id = 1 [(buf.validate.field).string.min_len = 1];
  int32 quantity = 2 [(buf.validate.field).int32.gt = 0];
  string order_id = 3 [(buf.validate.field).string.min_len = 1];
  string idempotency_key = 4 [(buf.validate.field).string.min_len = 1];
}

message ReleaseResponse {
  bool success = 1;
}

message GetStockRequest {
  string product_id = 1 [(buf.validate.field).string.min_len = 1];
}

message GetStockResponse {
  int32 available = 1;
  int32 reserved = 2;
}

message GetLedgerRequest {
  string product_id = 1 [(buf.validate.field).string.min_len = 1];
}

message LedgerEntry {
  string id = 1;
  string product_id = 2;
  string order_id = 3;
  int32 quantity_change = 4;
  LedgerOperation operation_type = 5;
  string created_at = 6;
}

message GetLedgerResponse {
  repeated LedgerEntry entries = 1;
}
